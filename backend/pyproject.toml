[project]
name = "xuesen-backend"
version = "0.1.0"
description = "Xuesen backend API (Beat integration without auth)"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite==0.20.0",
  "fastapi==0.115.6",
  "pydantic-settings==2.7.1",
  "pypdf==6.4.0",
  "sqlalchemy==2.0.36",
  "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.3",
]

[project.scripts]
xuesen-api = "cognoscope.api.main:run"
xuesen-worker = "cognoscope.workers.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]